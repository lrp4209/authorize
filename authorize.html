<!DOCTYPE html>
<html>
<head>
  <title>Authorizing...</title>
</head>
<body>
  <p>Authorizing, please wait...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ident = params.get('ident');

    console.log('Sending POST with ident:', ident);
    document.body.innerHTML += '<p><strong>Payload being sent:</strong> ident=' + ident + '</p>';

    fetch('https://hooks.zapier.com/hooks/catch/4359976/uc1vh9p/', {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'ident=' + encodeURIComponent(ident)
    }).then(() => {
      document.body.innerHTML += '<p><strong>Request sent!</strong></p>';
      setTimeout(() => {
        window.location.href = 'https://www.intwineconnect.com/thank-you2';
      }, 3000);
    }).catch(error => {
      console.log('Error:', error.message);
      document.body.innerHTML += '<p>Error: ' + error.message + '</p>';
    });
  </script>
</body>
</html>
