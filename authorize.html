<!DOCTYPE html>
<html>
<head>
  <title>Authorizing...</title>
</head>
<body>
  <p>Authorizing, please wait...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ident = params.get('ident');
    const payload = { ident: ident };

    // Log to console
    console.log('Sending POST to Zapier with payload:', JSON.stringify(payload));

    // Log visually on the page
    document.body.innerHTML += '<p><strong>Payload being sent:</strong> ' + JSON.stringify(payload) + '</p>';

    fetch('https://hooks.zapier.com/hooks/catch/4359976/uc1vh9p/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(response => {
      console.log('Response status:', response.status);
      document.body.innerHTML += '<p><strong>Response status:</strong> ' + response.status + '</p>';
      if (!response.ok) {
        throw new Error('Server responded with ' + response.status);
      }
      // Short delay so you can see the log before redirecting
      setTimeout(() => {
        window.location.href = 'https://www.intwineconnect.com/thank-you2';
      }, 3000);
    }).catch(error => {
      console.log('Error:', error.message);
      document.body.innerHTML += '<p>Error: ' + error.message + '</p>';
    });
  </script>
</body>
</html>
